<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Feedback Survey Form</title>
</head>

<body>
  <h1>Student Feedback Survey Form</h1>
  <p>This survey helps us understand student experiences and gather suggestions to improve our courses and services.
    Please fill in the details below — it takes less than 2 minutes.</p>
  <form method="GET">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required placeholder="Enter your Name" autofocus><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required placeholder="Enter your Email"><br><br>

    <label for="phone-number">Phone Number:</label>
    <input type="tel" id="phone-number" name="phone-number" required placeholder="Enter your Phone Number"
      pattern="[0-9]{10}"><br><br>

    <label for="surveydate">Date of Survey:</label>
    <input type="date" id="surveydate" name="surveydate" required><br><br>

    <label for="age">Age:</label>
    <input type="number" id="age" name="age" required placeholder="Age" min="5" max="50"><br><br>

    <fieldset>
      <legend>Gender</legend>
      <input type="radio" id="male" name="gender" value="male" required>
      <label for="male">Male</label>

      <input type="radio" id="female" name="gender" value="female" required>
      <label for="female">Female</label>
    </fieldset>

    <br><br>

    <fieldset>
      <legend>Hobbies</legend>

      <input type="checkbox" id="reading" name="hobbies" value="reading">
      <label for="reading">Reading</label>

      <input type="checkbox" id="sports" name="hobbies" value="sports">
      <label for="sports">Sports</label>

      <input type="checkbox" id="music" name="hobbies" value="music">
      <label for="music">Music</label>

      <input type="checkbox" id="coding" name="hobbies" value="coding">
      <label for="coding">Coding</label>

      <input type="checkbox" id="other" name="hobbies" value="other">
      <label for="other">Other</label>

    </fieldset>
    <br><br>

    <select id="course" name="course" required>
      <option value="">Select Course
      <option value="web-development">Web Development
      <option value="data-science">Data Science
      <option value="machine-learning">Machine Learning
      <option value="cloud-computing">Cloud Computing
      <option value="cyber-security">Cyber Security
      <option value="data-analyst">Data Analyst
    </select><br><br>

    <fieldset>
      <legend>Satisfaction Level</legend>
      <input type="radio" id="excellent" name="satisfaction level" value="excellent" required>
      <label for="excellent">Excellent</label>

      <input type="radio" id="good" name="satisfaction level" value="good" required>
      <label for="good">Good</label>

      <input type="radio" id="average" name="satisfaction level" value="average" required>
      <label for="average">Average</label>

      <input type="radio" id="poor" name="satisfaction level" value="poor" required>
      <label for="poor">Poor</label>

    </fieldset>

    <br><br>

    <label for="rating">Service Rating (1–10):</label>
    <input type="range" id="rating" name="rating" min="1" max="10" step="1" list="ratingList">
    <datalist id="ratingList">
      <option value="1">
      <option value="2">
      <option value="3">
      <option value="4">
      <option value="5">
      <option value="6">
      <option value="7">
      <option value="8">
      <option value="9">
      <option value="10">
    </datalist>

    <br><br>

    <label for="file-upload">Upload File (optional):</label>
    <input type="file" id="file-upload" name="file-upload" accept=".jpg, .jpeg, .png, .pdf"><br><br>


    <label for="feedback">Feedback:</label><br>
    <textarea id="feedback" name="feedback" rows="4" cols="50"
      placeholder="Please give your feedback here..."></textarea><br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

  </form>
</body>

</html>
